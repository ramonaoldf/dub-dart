name: dub
version: 0.0.4
description: Dub is a unofficial dart package for Dub.co APIs, providing a convenient wrapper around Dub API.

homepage: https://dub.co
repository: https://github.com/thealphamerc/dub-dart

environment:
  sdk: '>=2.17.0 <4.0.0'

dependencies:
  dio: '^5.2.0'
  json_annotation: '^4.4.0'

dev_dependencies:
  build_runner: any
  json_serializable: '^6.1.5'
  test: ^1.16.0
